name: Windows app
on:
  push:
    branches: [main, portfolio-verification]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt "pyinstaller>=6.13,<7"
      - run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name StockroomAI
          --add-data "static:static" --add-data "sql:sql" --add-data "examples:examples" desktop.pyw
      - name: Verify the packaged import and dashboard
        shell: pwsh
        run: |
          $directory = New-Item -Type Directory "$env:RUNNER_TEMP\stockroom-package-test"
          $output = Join-Path $directory.FullName 'result.txt'
          $process = Start-Process -FilePath 'dist\StockroomAI.exe' -ArgumentList "--self-test `"$output`"" -PassThru
          if (!$process.WaitForExit(90000)) {
            Stop-Process -Id $process.Id -Force
            throw "Stockroom AI self-test timed out."
          }
          if (Test-Path $output) { Get-Content $output }
          if ($process.ExitCode -ne 0 -or !(Test-Path $output) -or !(Select-String -Quiet -Path $output -Pattern '^PASS:')) {
            throw "Stockroom AI self-test failed."
          }
      - uses: actions/upload-artifact@v4
        with:
          name: StockroomAI-Windows
          path: dist/StockroomAI.exe
          if-no-files-found: error
