name: Portfolio verification
on:
  push:
    branches: [portfolio-verification]
permissions:
  contents: read
jobs:
  spreadsheet-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Import a 1C CSV and an Excel workbook in Chromium
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from openpyxl import Workbook
          from playwright.sync_api import sync_playwright, expect
          workbook = Workbook()
          workbook.active.append(["sku","name","category","stock","minimum","unit_cost"])
          workbook.active.append(["0002","Grinder","Accessories",3,5,80])
          workbook.save("store.xlsx")
          with subprocess.Popen(["python", "app.py", "--port", "0"], stdout=subprocess.PIPE, text=True) as server:
              try:
                  url = server.stdout.readline().split()[-1]
                  with sync_playwright() as playwright:
                      browser = playwright.chromium.launch()
                      page = browser.new_page()
                      page.goto(url)
                      expect(page.locator("#metric-products")).to_have_text("14")
                      page.get_by_text("Import Excel or CSV from 1C").click()
                      page.locator("#import-file").set_input_files("examples/one-c-stock.csv")
                      page.locator("#import-currency").select_option("PLN")
                      page.get_by_role("button", name="Preview").click()
                      expect(page.locator("#import-table")).to_contain_text("Кофе 250 г")
                      expect(page.locator("#metric-products")).to_have_text("14")
                      page.get_by_role("button", name="Confirm import").click()
                      expect(page.locator("#metric-products")).to_have_text("3")
                      page.locator("#import-file").set_input_files("store.xlsx")
                      page.get_by_role("button", name="Preview").click()
                      expect(page.locator("#import-table")).to_contain_text("0002")
                      page.get_by_role("button", name="Confirm import").click()
                      expect(page.locator("#metric-products")).to_have_text("4")
                      page.locator("#question").fill("What about SKU 0002?")
                      page.get_by_role("button", name="Ask", exact=True).click()
                      expect(page.locator("#result")).to_contain_text("Grinder has 3 units")
                      page.locator("#inventory-source").select_option("sample")
                      expect(page.locator("#metric-products")).to_have_text("14")
                      browser.close()
              finally:
                  server.terminate()
          PY
