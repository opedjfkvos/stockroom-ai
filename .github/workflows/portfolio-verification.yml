name: Portfolio verification
on:
  push:
    branches: [portfolio-verification]
permissions:
  contents: read
jobs:
  ollama:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start Ollama
        run: |
          docker run -d --name ollama -e OLLAMA_HOST=0.0.0.0:11434 -p 127.0.0.1:11434:11434 ollama/ollama
          curl --fail --retry 25 --retry-all-errors --retry-delay 2 http://127.0.0.1:11434/api/tags
          docker exec ollama ollama pull qwen2.5:1.5b
          docker exec ollama ollama run qwen2.5:1.5b "Say ready."
          docker exec ollama ollama list
      - name: Score raw model
        continue-on-error: true
        run: python model_eval.py --model qwen2.5:1.5b --holdout
      - name: Score application
        run: python model_eval.py --model qwen2.5:1.5b --holdout --app
      - name: Check reviewed cases with real Ollama
        run: |
          python - <<'PY'
          from assistant import UnsupportedQuestion, query_inventory
          for question in ("Do we have any laptops?", "Which products are not out of stock?", "What is our inventory value in euros?"):
              try:
                  query_inventory(question, "ollama")
              except UnsupportedQuestion:
                  print("Refused:", question)
              else:
                  raise RuntimeError("Answered an unsafe or unsupported question: " + question)
          for question, expected in (
              ("How many keyboards are in storage?", "16 units"),
              ("Which USB products need reordering?", "4 units"),
              ("How many units are on hand across the whole warehouse?", "178 units"),
          ):
              answer = query_inventory(question, "ollama")["answer"]
              print(answer)
              assert expected in answer
          PY
